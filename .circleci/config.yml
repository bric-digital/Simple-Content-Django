version: 2.1

orbs:
  python: circleci/python@1.2

workflows:
  build:
    jobs:
      - build-314
      - build-312
      - build-310
      - build-39
      - build-38
      - build-37
      - build-36
      - build-27

jobs:
  build-314:
    docker:
      - image: cimg/python:3.14
      - image: cimg/postgres:14.18-postgis
        auth:
          username: mydockerhub-user
          password: $DOCKERHUB_PASSWORD  # context / project UI env-var reference
        environment:
          POSTGRES_USER: root
          POSTGRES_DB: circle_test
          POSTGRES_PASSWORD: ""
    steps:
      - checkout
      - restore_cache:
          key: venv-314-{{ .Branch }}-{{ checksum "requirements.txt" }}-dep
      - run:
          name: Build and validate
          command: |
            python3 -m venv --copies /home/circleci/venv
            . /home/circleci/venv/bin/activate
            pip install -U pip
            pip install wheel
            pip install -r requirements.txt
            cd ..
            mv project simple_dashboard
            mkdir django
            cd django
            django-admin startproject sd
            mv ../simple_dashboard sd
            cd sd
            cp simple_dashboard/.circleci/circle_settings.py sd/settings.py
            git clone https://github.com/audacious-software/Quicksilver-Django.git quicksilver
            pip install -r quicksilver/requirements.txt
            python manage.py migrate
            python manage.py install_quicksilver_tasks
            python manage.py simple_dashboard_update_values
            python manage.py test
            cp simple_dashboard/.pylintrc .
            pylint simple_dashboard
            bandit -r .
      - save_cache:
          key: venv-314-{{ .Branch }}-{{ checksum "/home/circleci/django/sd/simple_dashboard/requirements.txt" }}
          paths:
            - "/home/circleci/venv"
      - store_test_results:
          path: test-results/
      - store_artifacts:
          path: test-reports/
          destination: python_app

